<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>れ・こんきすた。</title>
  </head>
  <body>
    <time id="game-time" aria-label="ゲーム内の現在日時">1年1月1日 08時</time>
    <ul id="item-summary" aria-label="保管箱内のアイテム"></ul>
    <nav id="time-controls" aria-label="ゲーム速度">
      <button type="button" data-game-speed="0" aria-pressed="false">一時停止</button>
      <button type="button" data-game-speed="1" aria-pressed="true">1倍</button>
      <button type="button" data-game-speed="3" aria-pressed="false">3倍</button>
    </nav>
    <nav id="pawn-roster" aria-label="ポーン一覧"></nav>
    <nav id="selection-actions" aria-label="選択対象の操作">
    <button id="pawn-mode-button" type="button" aria-label="ポーンを選択して状態を切り替え" disabled>
      <span id="pawn-mode-icon" aria-hidden="true">⚔</span>
      <span id="pawn-mode-label">徴兵</span>
    </button>
    <button id="door-mode-button" type="button" aria-label="扉の動作：開閉" hidden><span aria-hidden="true">🚪</span><span id="door-mode-label">開閉</span></button>
    <button id="drop-inventory-button" type="button" hidden disabled>
      <span aria-hidden="true">↓</span><span>地面に置く</span>
    </button>
    <button id="item-info-button" type="button" aria-label="アイテムのインフォメーション" aria-controls="item-properties" hidden>?</button>
    <button id="acquisition-button" type="button" aria-pressed="false" hidden>無視</button>
    <button id="collection-button" type="button" aria-pressed="false" hidden>無視</button>
    <button id="hunting-button" type="button" aria-pressed="false" hidden>無視</button>
    </nav>
    <section id="pawn-specs" aria-label="ポーンのスペック" hidden></section>
    <dialog id="item-properties" aria-labelledby="item-properties-name">
      <button id="close-item-properties" type="button" aria-label="プロパティウィンドウを閉じる">×</button>
      <h2 id="item-properties-name"></h2>
      <dl>
        <dt data-item-property>質量</dt><dd id="item-properties-mass" data-item-property></dd>
        <dt data-food-property hidden>栄養</dt><dd id="food-nutrition" data-food-property hidden></dd>
        <dt data-weapon-property hidden>射程</dt><dd id="weapon-range" data-weapon-property hidden></dd>
        <dt data-weapon-property hidden>ダメージ</dt><dd id="weapon-damage" data-weapon-property hidden></dd>
        <dt data-weapon-property hidden>基礎命中率</dt><dd id="weapon-accuracy" data-weapon-property hidden></dd>
        <dt data-weapon-property hidden>貫徹</dt><dd id="weapon-penetration" data-weapon-property hidden></dd>
        <dt data-weapon-property hidden>攻撃間隔</dt><dd id="weapon-interval" data-weapon-property hidden></dd>
        <dt data-environment-property hidden>収集速度</dt><dd id="environment-harvest-speed" data-environment-property hidden></dd>
        <dt data-environment-property hidden>収集量</dt><dd id="environment-harvest-quantity" data-environment-property hidden></dd>
        <dt data-environment-property hidden>HP</dt><dd id="environment-hp" data-environment-property hidden></dd>
        <dt data-animal-property hidden>勢力</dt><dd id="animal-faction" data-animal-property hidden></dd>
        <dt data-wolf-property hidden>攻撃</dt><dd id="wolf-attack" data-wolf-property hidden></dd>
        <dt data-wolf-property hidden>反撃確率</dt><dd id="wolf-retaliation" data-wolf-property hidden></dd>
        <dt data-animal-property hidden>行動</dt><dd id="animal-action" data-animal-property hidden></dd>
        <dt data-animal-property hidden>装甲</dt><dd id="animal-armor" data-animal-property hidden></dd>
        <dt data-animal-property hidden>満腹感</dt><dd id="animal-satiety" class="animal-needs-meter" data-animal-property hidden></dd>
        <dt data-animal-property hidden>覚醒度</dt><dd id="animal-wakefulness" class="animal-needs-meter" data-animal-property hidden></dd>
        <dt data-corpse-property hidden>質量</dt><dd id="corpse-mass" data-corpse-property hidden></dd>
        <dt data-animal-property hidden>HP</dt><dd id="animal-hp" data-animal-property hidden></dd>
      </dl>
    </dialog>
    <button class="construction-tab" type="button" aria-expanded="false" aria-controls="construction-subtabs">建設</button>
    <button id="priorities-tab" class="construction-tab" type="button" aria-expanded="false" aria-controls="priorities-window">優先順位</button>
    <dialog id="priorities-window" aria-labelledby="priorities-title">
      <button id="close-priorities" type="button" aria-label="優先順位ウィンドウを閉じる">×</button>
      <h2 id="priorities-title">優先順位</h2>
      <table><thead><tr><th scope="col">ポーン</th><th scope="col">建設</th><th scope="col">収集</th><th scope="col">運搬</th><th scope="col">解体</th><th scope="col">調理</th><th scope="col">狩猟</th><th scope="col">自由</th></tr></thead><tbody id="priorities-rows"></tbody></table>
    </dialog>
    <nav id="construction-subtabs" class="construction-subtabs" aria-label="建設の下位タブ" hidden>
      <button id="buildings-tab" class="construction-subtab" type="button" aria-expanded="false" aria-controls="building-options">建物</button>
      <button id="workshops-tab" class="construction-subtab" type="button" aria-expanded="false" aria-controls="workshop-options">作業所</button>
      <button id="furniture-tab" class="construction-subtab" type="button" aria-expanded="false" aria-controls="furniture-options">家具</button>
      <button id="storage-tab" class="construction-subtab" type="button" aria-expanded="false" aria-controls="storage-options">保管</button>
      <button id="defense-tab" class="construction-subtab" type="button" aria-expanded="false" aria-controls="defense-options">防衛</button>
      <button id="floors-tab" class="construction-subtab" type="button" aria-expanded="false" aria-controls="floor-options">床</button>
      <button id="demolition-button" class="construction-subtab" type="button" aria-pressed="false">破壊</button>
    </nav>
    <nav id="floor-options" class="building-options" aria-label="床の選択" hidden><button id="stone-floor-button" class="construction-subtab" type="button" aria-pressed="false">石張り</button><button id="wood-floor-button" class="construction-subtab" type="button" aria-pressed="false">木張り</button></nav>
    <nav id="stone-floor-materials" class="wall-materials" hidden></nav><nav id="wood-floor-materials" class="wall-materials" hidden></nav>
    <nav id="furniture-options" class="building-options" aria-label="家具の選択" hidden><button id="bed-button" class="construction-subtab" type="button" aria-pressed="false">ベッド（木材）</button><button id="table-button" class="construction-subtab" type="button" aria-pressed="false" aria-haspopup="true" aria-expanded="false" aria-controls="table-materials">テーブル（木材）</button><button id="chair-button" class="construction-subtab" type="button" aria-pressed="false" aria-haspopup="true" aria-expanded="false" aria-controls="chair-materials">椅子（木材）</button></nav>
    <nav id="table-materials" class="wall-materials" aria-label="テーブルの素材" hidden>
      <button class="construction-subtab" type="button" data-material="wood" aria-pressed="true">木材</button>
      <button class="construction-subtab" type="button" data-material="stone" aria-pressed="false">石材</button>
    </nav>
    <nav id="chair-materials" class="wall-materials" aria-label="椅子の素材" hidden>
      <button class="construction-subtab" type="button" data-material="wood" aria-pressed="true">木材</button>
      <button class="construction-subtab" type="button" data-material="stone" aria-pressed="false">石材</button>
    </nav>
    <nav id="bed-materials" class="wall-materials" hidden></nav>
    <nav id="workshop-options" class="building-options" aria-label="作業所の選択" hidden>
      <button id="butcher-button" class="construction-subtab" type="button" aria-pressed="false">解体所（木材）</button>
      <button id="cooker-button" class="construction-subtab" type="button" aria-pressed="false">調理器（木材）</button>
    </nav>
    <nav id="cooker-materials" class="wall-materials" hidden></nav>
    <nav id="butcher-materials" class="wall-materials" hidden></nav>
    <section id="station-info" aria-label="建造物のインフォメーション" hidden>
      <button id="station-work-button" type="button">作業</button><h2>解体所</h2><p id="structure-hp"></p><p id="station-status"></p>
    </section>
    <dialog id="station-work" aria-label="解体所の作業一覧">
      <button id="close-station-work" type="button" aria-label="作業一覧を閉じる">×</button><h2>作業一覧</h2>
      <div class="butcher-bill"><button id="butcher-once" type="button">解体</button><button id="butcher-minus" type="button">−</button><output id="butcher-count" data-zero="true">0</output><button id="butcher-plus" type="button">＋</button></div>
      <div class="butcher-bill"><label for="meat-target">アイテム</label><input id="meat-target" type="number" min="0" step="1" value="0" aria-label="目標の肉の個数"/><button id="repeat-until" type="button" aria-pressed="false">まで繰り返す</button></div>
      <button id="repeat-forever" type="button" aria-pressed="false">無限</button>
    </dialog>
    <nav id="building-options" class="building-options" aria-label="建物の選択" hidden>
      <button id="wall-button" class="construction-subtab" type="button" aria-pressed="false" aria-haspopup="true" aria-expanded="false" aria-controls="wall-materials">壁</button>
      <button id="torch-button" class="construction-subtab" type="button" aria-pressed="false">たいまつ（木材）</button>
      <button id="door-button" class="construction-subtab" type="button" aria-pressed="false">扉（木材）</button>
    </nav>
    <nav id="door-materials" class="wall-materials" hidden></nav>
    <nav id="torch-materials" class="wall-materials" hidden></nav>
    <nav id="wall-materials" class="wall-materials" aria-label="壁の素材" hidden>
      <button class="construction-subtab" type="button" data-material="wood" aria-pressed="true">木材</button>
      <button class="construction-subtab" type="button" data-material="stone" aria-pressed="false">石材</button>
    </nav>
    <nav id="defense-options" class="building-options" aria-label="防衛の選択" hidden>
      <button id="barricade-button" class="construction-subtab" type="button" aria-pressed="false" aria-haspopup="true" aria-expanded="false" aria-controls="barricade-materials">バリケード</button>
    </nav>
    <nav id="barricade-materials" class="wall-materials" aria-label="バリケードの素材" hidden>
      <button class="construction-subtab" type="button" data-material="wood" aria-pressed="true">木材</button>
      <button class="construction-subtab" type="button" data-material="stone" aria-pressed="false">石材</button>
    </nav>
    <nav id="storage-options" class="building-options" aria-label="保管の選択" hidden>
      <button id="storage-area-button" class="construction-subtab" type="button" aria-pressed="false">保管エリア</button>
      <button id="storage-button" class="construction-subtab" type="button" aria-pressed="false">保管箱</button>
    </nav>
    <nav id="storage-area-materials" class="wall-materials" hidden></nav>
    <nav id="storage-materials" class="wall-materials" hidden></nav>
    <dialog id="storage-settings" aria-labelledby="storage-settings-title">
      <button id="close-storage-settings" type="button" aria-label="保管箱設定を閉じる">×</button>
      <h2 id="storage-settings-title">保管箱</h2>
      <p>受け入れるアイテム</p>
      <label><input type="checkbox" data-storage-type="wood" checked />木材 <span id="stored-wood">0</span></label>
      <label><input type="checkbox" data-storage-type="stone" checked />石材 <span id="stored-stone">0</span></label>
      <label><input type="checkbox" data-storage-type="ration" checked />携帯食料 <span id="stored-ration">0</span></label>
      <label><input type="checkbox" data-storage-type="strawberry" checked />苺 <span id="stored-strawberry">0</span></label>
      <label><input type="checkbox" data-storage-type="knife" checked />ナイフ <span id="stored-knife">0</span></label>
      <label><input type="checkbox" data-storage-type="rifle" checked />ライフル <span id="stored-rifle">0</span></label>
      <label><input type="checkbox" data-storage-type="meat" checked />肉 <span id="stored-meat">0</span></label>
      <label><input type="checkbox" data-storage-type="humanCorpse" checked />人間の死体 <span id="stored-humanCorpse">0</span></label>
      <label><input type="checkbox" data-storage-type="wolfCorpse" checked />狼の死体 <span id="stored-wolfCorpse">0</span></label>
      <label><input type="checkbox" data-storage-type="deerCorpse" checked />鹿の死体 <span id="stored-deerCorpse">0</span></label>
    </dialog>
    <dialog id="construction-command" aria-label="建設の指示">
      <button id="close-construction-command" type="button" aria-label="建設の指示を閉じる">×</button>
      <button id="immediate-construction" type="button">今すぐ建設</button>
    </dialog>
    <dialog id="food-command" aria-label="食料の操作">
      <button id="close-food-command" type="button" aria-label="苺の操作を閉じる">×</button>
      <button id="eat-now-button" type="button">今すぐ食べる</button>
      <button type="button" data-immediate-haul hidden>今すぐ運搬</button>
    </dialog>
    <dialog id="equipment-command" aria-label="武器の操作">
      <button id="close-equipment-command" type="button" aria-label="武器の操作を閉じる">×</button>
      <button id="equip-button" type="button">装備する</button>
      <button type="button" data-immediate-haul hidden>今すぐ運搬</button>
    </dialog>
    <dialog id="haul-command" aria-label="アイテムの運搬">
      <button id="close-haul-command" type="button" aria-label="運搬操作を閉じる">×</button>
      <button id="devour-button" type="button" hidden>捕食する</button>
      <button id="haul-now-button" type="button" data-immediate-haul>今すぐ運搬</button>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
